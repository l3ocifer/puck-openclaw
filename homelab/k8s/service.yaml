---
apiVersion: v1
kind: Service
metadata:
  name: puck
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: puck
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: puck
  ports:
    - { name: gateway, port: 18789, targetPort: gateway, protocol: TCP }
    # OpenClaw serves /metrics on the gateway port — nothing binds 9100
    # (homelab#47: TargetDown).
    - { name: metrics, port: 9100,  targetPort: gateway, protocol: TCP }
    - { name: a2a, port: 8443, targetPort: gateway, protocol: TCP }
